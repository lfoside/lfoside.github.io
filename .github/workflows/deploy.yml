name: Deploy to GitHub Pages

on:
  # Публикуем при каждом пуше в main. Если основная ветка называется иначе —
  # замените main на её имя.
  push:
    branches: [main]
  # Плюс ручной запуск с вкладки Actions.
  workflow_dispatch:

# Разрешения: клонировать репо и создать deployment для Pages.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        # with:
        #   path: .          # корень Astro-проекта в репозитории
        #   node-version: 24 # версия Node для сборки (по умолчанию 24)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
